---
- name: Install personal development machine
  hosts: localhost
  tasks:
    - ansible.builtin.import_role:
        name: dotfiles
      tags: dotfiles

    # Install all standard packages (pacman, AUR)
    - ansible.builtin.import_role:
        name: packages
      tags: packages

    # Apply hardware tweaks that only apply to known machines
    - ansible.builtin.import_role:
        name: laptop-audio
      tags: laptop-audio
      when: "'16IAX10H' in (ansible_facts['product_version'] | default(''))"

    # Install tools requiring custom installation methods
    - ansible.builtin.import_role:
        name: custom-installs
      tags: custom-installs

    # Enable systemd user services started with the graphical session
    - ansible.builtin.import_role:
        name: user-services
      tags: user-services

    - ansible.builtin.import_role:
        name: fonts
      tags: fonts

    - ansible.builtin.import_role:
        name: ufw
      tags: ufw

    - ansible.builtin.import_role:
        name: greetd
      tags: greetd

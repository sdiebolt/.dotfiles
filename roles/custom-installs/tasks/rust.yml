---
- name: Check if rustup is installed
  ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.cargo/bin/rustup --version"
  register: rustup_exists
  ignore_errors: true
  changed_when: false
  failed_when: false

- name: Install Rust/cargo
  when: rustup_exists.rc != 0
  block:
    - name: Ensure curl is installed
      become: true
      community.general.pacman:
        name: curl
        state: present

    - name: Install Rust/cargo via rustup
      ansible.builtin.shell: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      args:
        creates: "{{ ansible_facts.env.HOME }}/.cargo/bin/rustup"

- name: Check installed rustup components
  ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.cargo/bin/rustup component list --installed"
  register: rustup_components
  changed_when: false

- name: Install rust-analyzer rustup component
  ansible.builtin.command: "{{ ansible_facts.env.HOME }}/.cargo/bin/rustup component add rust-analyzer"
  when: "'rust-analyzer' not in rustup_components.stdout"
